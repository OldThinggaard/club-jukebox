[Service]
# The disk installer, Wi-Fi and Onlime login run through sudo. NoNewPrivileges
# would make sudo exit before the disk is touched, and the guide would say the
# installation could not start. The copy of the live system also needs more
# than the daily memory cap.
NoNewPrivileges=false
MemoryMax=infinity
Environment=Jukebox__InstallerMode=true
Environment=Jukebox__SeedSampleMedia=false
